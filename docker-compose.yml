version: "3.9"

services:
  web:
    build: .
    command: >
      sh -c "
      python3 manage.py wait_for_db &&
      python3 manage.py migrate &&
      python3 manage.py loaddata data.json &&
      python3 manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: 'django-insecure-=4d^hz&4210itk690*4h@j=ira#2t3$9m7f3ru_93)i6jpgp&t'
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
